name: Construire APK et EXE proprietaire
on:
  workflow_dispatch:
    inputs:
      cible:
        description: Que construire ?
        type: choice
        default: APK
        options:
          - APK
          - EXE-portable
          - EXE-installateur
          - EXE-installateur-publier
jobs:
  apk:
    if: ${{ inputs.cible == 'APK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: build
    steps:
      - uses: actions/checkout@v4
      - name: Dezipper
        working-directory: .
        run: |
          LIST="$(ls -1 logiciel-*.[zZ][iI][pP] 2>/dev/null || true)"
          mkdir -p build
          if [ -n "$LIST" ]; then
            echo "Archives du logiciel (fusionnees) :"
            for Z in $LIST; do echo " - $Z"; unzip -oq "$Z" -d build; done
          elif ls *.[zZ][iI][pP] >/dev/null 2>&1; then
            Z="$(ls -1S *.[zZ][iI][pP] | head -n 1)"
            echo "Zip utilise (le plus gros) : $Z"
            unzip -oq "$Z" -d build
          elif [ -d electron ] && [ -d site ]; then
            echo "Pas de zip : le depot contient deja le logiciel"
            tar --exclude=./build --exclude=./.git -cf - . | tar -xf - -C build
          else
            echo "ERREUR : aucun zip et pas de dossier electron/ + site/ a la racine"
            exit 1
          fi
          if [ ! -f build/package.json ]; then
            P="$(find build -maxdepth 3 -name package.json -not -path '*/node_modules/*' | while read -r f; do d="$(dirname "$f")"; if [ -d "$d/electron" ] && [ -d "$d/site" ]; then echo "$d"; break; fi; done)"
            echo "Dossier du logiciel trouve : $P"
            if [ -n "$P" ]; then cp -a "$P"/. build/; fi
          fi
          echo "Contenu de build :"
          ls build
          if [ ! -f build/package.json ] || [ ! -d build/electron ] || [ ! -d build/site ]; then
            echo "ERREUR : il manque package.json, electron/ ou site/ dans build."
            echo "Le depot doit contenir les archives logiciel-...-partie-1-sur-2.zip ET logiciel-...-partie-2-sur-2.zip (ou le zip complet du depot)."
            exit 1
          fi
      - name: Marque
        working-directory: .
        env:
          BRAND: '{"version":1,"name":"Excellencia Building","short":"Excellencia","appId":"com.excellencia.building"}'
        run: mkdir -p build/clients/proprio && node -e "require('fs').writeFileSync('build/clients/proprio/entreprise.json',process.env.BRAND)"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install && npm install --no-save --no-audit sharp
      - run: node scripts/apply-brand.js clients/proprio/entreprise.json
      - run: npm run build:www
        env:
          EXB_OWNER: '1'
      - run: npm run android:add
      - run: npm run android:sync
        env:
          EXB_OWNER: '1'
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: build/android
      - run: cp build/android/app/build/outputs/apk/debug/app-debug.apk Excellencia-PROPRIETAIRE.apk
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: APK-proprietaire
          path: Excellencia-PROPRIETAIRE.apk
          retention-days: 30
  exe:
    if: ${{ startsWith(inputs.cible, 'EXE') }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      CIBLE_EXE: ${{ inputs.cible == 'EXE-portable' && 'portable' || 'nsis' }}
      PUBLIER: ${{ inputs.cible == 'EXE-installateur-publier' && 'always' || 'never' }}
    steps:
      - uses: actions/checkout@v4
      - name: Dezipper
        run: |
          LIST="$(ls -1 logiciel-*.[zZ][iI][pP] 2>/dev/null || true)"
          mkdir -p build
          if [ -n "$LIST" ]; then
            echo "Archives du logiciel (fusionnees) :"
            for Z in $LIST; do echo " - $Z"; 7z x "$Z" -obuild -y > /dev/null || [ $? -eq 1 ]; done
          elif ls *.[zZ][iI][pP] >/dev/null 2>&1; then
            Z="$(ls -1S *.[zZ][iI][pP] | head -n 1)"
            echo "Zip utilise (le plus gros) : $Z"
            7z x "$Z" -obuild -y > /dev/null || [ $? -eq 1 ]
          elif [ -d electron ] && [ -d site ]; then
            echo "Pas de zip : le depot contient deja le logiciel"
            tar --exclude=./build --exclude=./.git -cf - . | tar -xf - -C build
          else
            echo "ERREUR : aucun zip et pas de dossier electron/ + site/ a la racine"
            exit 1
          fi
          if [ ! -f build/package.json ]; then
            P="$(find build -maxdepth 3 -name package.json -not -path '*/node_modules/*' | while read -r f; do d="$(dirname "$f")"; if [ -d "$d/electron" ] && [ -d "$d/site" ]; then echo "$d"; break; fi; done)"
            echo "Dossier du logiciel trouve : $P"
            if [ -n "$P" ]; then cp -a "$P"/. build/; fi
          fi
          echo "Contenu de build :"
          ls build
          if [ ! -f build/package.json ] || [ ! -d build/electron ] || [ ! -d build/site ]; then
            echo "ERREUR : il manque package.json, electron/ ou site/ dans build."
            echo "Le depot doit contenir les archives logiciel-...-partie-1-sur-2.zip ET logiciel-...-partie-2-sur-2.zip (ou le zip complet du depot)."
            exit 1
          fi
      - name: Marque
        env:
          BRAND: '{"version":1,"name":"Excellencia Building","short":"Excellencia","appId":"com.excellencia.building"}'
        run: mkdir -p build/clients/proprio && node -e "require('fs').writeFileSync('build/clients/proprio/entreprise.json',process.env.BRAND)"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install && npm install --no-save --no-audit sharp
        working-directory: build
      - run: node scripts/apply-brand.js clients/proprio/entreprise.json
        working-directory: build
      - name: Corriger les noms de fichiers
        working-directory: build/electron
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.build.artifactName;p.build.nsis.artifactName='Excellencia-Building-Installateur-\${version}.\${ext}';p.build.portable={artifactName:'Excellencia-Building-Portable-\${version}.\${ext}'};fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: Version et publication
        if: ${{ inputs.cible == 'EXE-installateur-publier' }}
        working-directory: build/electron
        env:
          DEPOT: ${{ github.repository }}
          NUMERO: ${{ github.run_number }}
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const r=process.env.DEPOT.split('/');p.version='1.0.'+process.env.NUMERO;p.build.publish={provider:'github',owner:r[0],repo:r[1],releaseType:'release'};fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: Installer
        working-directory: build/electron
        env:
          EXB_OWNER: '1'
        run: npm install
      - name: Preparer
        working-directory: build/electron
        env:
          EXB_OWNER: '1'
        run: node scripts/prepare.js
      - name: Compiler l'EXE
        working-directory: build/electron
        env:
          EXB_OWNER: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx electron-builder --win $CIBLE_EXE --x64 --publish $PUBLIER 2>&1 | tee ../../compile-log.txt
      - name: Resume de l'erreur (lisible sur telephone)
        if: ${{ failure() && hashFiles('compile-log.txt') != '' }}
        run: |
          {
            echo "## Erreur de compilation de l'EXE"
            echo "### Lignes qui parlent d'erreur"
            echo '```'
            grep -n -i -E "error|failed|cannot|invalid|unknown|not found|warning:" compile-log.txt | head -40 || true
            echo '```'
            echo "### 40 dernieres lignes avant la fin"
            echo '```'
            tail -n 40 compile-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && hashFiles('compile-log.txt') != '' }}
        with:
          name: journal-compilation-exe
          path: compile-log.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: EXE-proprietaire
          path: build/electron/dist/*.exe
          retention-days: 30
