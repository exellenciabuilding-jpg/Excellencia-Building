name: Construire APK et EXE proprietaire
on:
  workflow_dispatch:
    inputs:
      cible:
        description: Que construire ?
        type: choice
        default: APK
        options:
          - APK
          - EXE-portable
          - EXE-installateur
          - EXE-installateur-publier
jobs:
  apk:
    if: ${{ inputs.cible == 'APK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: build
    steps:
      - uses: actions/checkout@v4
      - name: Dezipper
        working-directory: .
        run: unzip -oq Excellencia-V120*.zip -d build
      - name: Marque
        working-directory: .
        env:
          BRAND: '{"version":1,"name":"Excellencia Building","short":"Excellencia","appId":"com.excellencia.building"}'
        run: mkdir -p build/clients/proprio && node -e "require('fs').writeFileSync('build/clients/proprio/entreprise.json',process.env.BRAND)"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install && npm install --no-save --no-audit sharp
      - run: node scripts/apply-brand.js clients/proprio/entreprise.json
      - run: npm run android:add
      - run: npm run android:sync
        env:
          EXB_OWNER: '1'
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: build/android
      - run: cp build/android/app/build/outputs/apk/debug/app-debug.apk Excellencia-PROPRIETAIRE.apk
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: APK-proprietaire
          path: Excellencia-PROPRIETAIRE.apk
          retention-days: 30
  exe:
    if: ${{ startsWith(inputs.cible, 'EXE') }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      CIBLE_EXE: ${{ inputs.cible == 'EXE-portable' && 'portable' || 'nsis' }}
      PUBLIER: ${{ inputs.cible == 'EXE-installateur-publier' && 'always' || 'never' }}
    steps:
      - uses: actions/checkout@v4
      - name: Dezipper
        run: 7z x Excellencia-V120*.zip -obuild -y
      - name: Marque
        env:
          BRAND: '{"version":1,"name":"Excellencia Building","short":"Excellencia","appId":"com.excellencia.building"}'
        run: mkdir -p build/clients/proprio && node -e "require('fs').writeFileSync('build/clients/proprio/entreprise.json',process.env.BRAND)"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install && npm install --no-save --no-audit sharp
        working-directory: build
      - run: node scripts/apply-brand.js clients/proprio/entreprise.json
        working-directory: build
      - name: Corriger les noms de fichiers
        working-directory: build/electron
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.build.artifactName;p.build.nsis.artifactName='Excellencia-Building-Installateur-\${version}.\${ext}';p.build.portable={artifactName:'Excellencia-Building-Portable-\${version}.\${ext}'};fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: Version et publication
        if: ${{ inputs.cible == 'EXE-installateur-publier' }}
        working-directory: build/electron
        env:
          DEPOT: ${{ github.repository }}
          NUMERO: ${{ github.run_number }}
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const r=process.env.DEPOT.split('/');p.version='1.0.'+process.env.NUMERO;p.build.publish={provider:'github',owner:r[0],repo:r[1],releaseType:'release'};fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: Installer
        working-directory: build/electron
        env:
          EXB_OWNER: '1'
        run: | set -o pipefail mkdir -p ../../logs for i in 1 2 3; do echo "=== npm install, essai $i ===" | tee -a ../../logs/1-installer.txt npm install --no-audit --no-fund 2>&1 | tee -a ../../logs/1-installer.txt && exit 0 sleep 15 done exit 1       - name: Preparer
        working-directory: build/electron
        env:
          EXB_OWNER: '1'
        run: | set -o pipefail node scripts/prepare.js 2>&1 | tee ../../logs/2-preparer.txt       - name: Compiler l'EXE
        working-directory: build/electron
        env:
          EXB_OWNER: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: | set -o pipefail npx electron-builder --win $CIBLE_EXE --x64 --publish $PUBLIER 2>&1 | tee ../../logs/3-compiler.txt       - name: Resume de l'erreur (lisible sur telephone)
        if: ${{ failure() }}
        run: | { echo "## Resume de l'erreur de l'EXE" if ls logs/*.txt >/dev/null 2>&1; then for f in logs/*.txt; do echo "### $(basename "$f") : lignes d'erreur" echo '```' grep -n -i -E "error|failed|cannot|invalid|unknown|not found|ERR!" "$f" | head -25 || true echo '```' echo "### $(basename "$f") : 25 dernieres lignes" echo '```' tail -n 25 "$f" || true echo '```' done else echo "Aucun journal n'a ete cree." fi } >> "$GITHUB_STEP_SUMMARY"       - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: journaux-exe
          path: logs
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: EXE-proprietaire
          path: build/electron/dist/*.exe
          retention-days: 30
