name: Construire l'application Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire le ZIP
        run: |
          mkdir projet
          unzip -q ./*.zip -d projet
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
        working-directory: projet
      - run: npm run build:www
        working-directory: projet
      - run: npx cap add android
        working-directory: projet
      - run: node scripts/patch-android.js
        working-directory: projet
      - run: npx cap sync android
        working-directory: projet
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: projet/android
      - uses: actions/upload-artifact@v4
        with:
          name: excellencia-building-debug-apk
          path: projet/android/app/build/outputs/apk/debug/app-debug.apk
