name: Construire l'application Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire les ZIP
        run: |
          mkdir projet cle-importee
          for z in ./*.zip; do
            if [ "$(basename "$z")" = "cle-de-signature.zip" ]; then
              unzip -q -o "$z" -d cle-importee
            else
              unzip -q "$z" -d projet
            fi
          done
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Clé de signature fixe
        run: |
          mkdir -p ~/.android cle-signature
          if [ -f cle-importee/debug.keystore ]; then
            cp cle-importee/debug.keystore ~/.android/debug.keystore
            echo "Clé importée depuis le ZIP utilisée."
          elif [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "Clé existante utilisée."
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Excellencia Building"
            cp ~/.android/debug.keystore cle-signature/debug.keystore
            echo "NOUVELLE_CLE=1" >> $GITHUB_ENV
          fi
      - run: npm install
        working-directory: projet
      - run: npm run build:www
        working-directory: projet
      - run: npx cap add android
        working-directory: projet
      - run: node scripts/patch-android.js
        working-directory: projet
      - run: npx cap sync android
        working-directory: projet
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: projet/android
      - uses: actions/upload-artifact@v4
        with:
          name: excellencia-building-debug-apk
          path: projet/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: env.NOUVELLE_CLE == '1'
        with:
          name: cle-de-signature
          path: cle-signature/debug.keystore
